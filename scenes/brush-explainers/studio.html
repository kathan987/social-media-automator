<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vice Lowdown brush beats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@600&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { height: min(80vh, 960px); aspect-ratio: 9 / 16; width: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 720px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="../../node_modules/p5/lib/p5.min.js"></script>
<script src="../../node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="34" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine (ClaudeAnimationBase, MIT: core + timeline only, no Clawd) -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/timeline.js"></script>
<!-- our painted people and props, then the beats -->
<script src="src/scenes/figures.js"></script>
<script src="src/scenes/lucia.js"></script>
<script src="src/scenes/arthur.js"></script>
</body>
</html>
