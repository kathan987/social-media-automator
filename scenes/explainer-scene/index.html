<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap.min.js"></script>
<!-- Explainer template self-test: the Three.js timeline (0-4 s) then the jet (4-8 s). Real Shorts are generated by
     tools/sticker_short.py, which copies this folder's assets. -->
<style>
@font-face{font-family:"Bebas";src:url("assets/fonts/BebasNeue-Regular.ttf")}
@font-face{font-family:"Anton";src:url("assets/fonts/Anton-Regular.ttf")}
@font-face{font-family:"Poppins";src:url("assets/fonts/Poppins-SemiBold.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Bebas",sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a2c1a 0%,#0b0b0b 70%)}
#ui{position:absolute;inset:0}
#three{position:absolute;inset:0;width:1080px;height:1920px}
#t{position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:110px;color:#fff;text-shadow:0 6px 18px #000}
</style>
<script>
window.__three = [{"kind": "timeline", "start": 0, "end": 4, "labels": ["CHAPTER 2|JAILBREAK|#ffd84a", "GUARMA|PICKED UP|#ff9f43", "CHAPTER 6|THE TRUTH|#ff3b4a"]},
                  {"kind": "jet", "start": 4, "end": 8, "labels": []}];
window.__hf = window.__hf || {};
window.__hf.buildReady = window.__hf.buildReady || {};
window.__hf.buildReady.three = new Promise(function (r) { window.__threeReady = r; });
</script>
<script type="module" src="assets/explain3d.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <div id="bg" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
  <div id="ui" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-allow-overlap data-layout-allow-overflow>
    <canvas id="three" width="1080" height="1920"></canvas>
    <div id="t">THREE.JS SELF-TEST</div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#t", { scale: 1.2 }, { scale: 1, duration: 0.3 }, 0).to("#t", { opacity: 0.5, duration: 0.2 }, 7.5);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
